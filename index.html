<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIUserTwin | Cognitive Asset Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --font-main: 'Plus Jakarta Sans', sans-serif; 
            --font-mono: 'JetBrains Mono', monospace;
            --bg-deep: #09090b;
            --bg-surface: #18181b;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent-blue: #2563eb;
        }
        body { 
            font-family: var(--font-main); 
            background-color: var(--bg-deep);
            color: #d4d4d8; /* Zinc 300 */
            overflow-x: hidden;
            /* Technical Grid Background */
            background-image: 
                linear-gradient(var(--border-subtle) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        /* Utility for "Professional Card" look */
        .tech-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
        }
        
        .tech-border-b { border-bottom: 1px solid var(--border-subtle); }
        .tech-border-t { border-top: 1px solid var(--border-subtle); }
        
        .mono-text { font-family: var(--font-mono); }
        
        .nav-glass { 
            background: rgba(9, 9, 11, 0.9); 
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(10px);
        }
        
        /* Animation - Snappier */
        .page-enter { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Scrollbar - Thin & Dark */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 0px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Typography Utilities */
        .tracking-tight-custom { letter-spacing: -0.02em; }
    </style>
